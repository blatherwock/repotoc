# Test suite and static checks, mirroring `just test` and `just check`:
# the dev Python (coverage gate) and the floor Python (pass-only; the
# version-guarded branch cannot be covered there), plus formatting, lint,
# types, and doc freshness on the dev Python.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Test (coverage gate)
        if: matrix.python == '3.14'
        run: uv run pytest
      - name: Test (pass-only)
        if: matrix.python == '3.11'
        run: uv run pytest --no-cov -q

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run repotoc --check
      - run: uv run python src/tools/site_build.py check
