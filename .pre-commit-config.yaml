# Commit gates: the repository's own recipes, exactly as run by hand. The
# gates always exercise the working tree, so changed RepoTOC behavior applies
# before it is committed. `just fix` writes (format, safe lint fixes, doc
# regeneration); when it changes files pre-commit fails the commit and leaves
# the fixes unstaged. `just check` then verifies what fix cannot fix (type
# errors, unfixable lint, stale docs). Tools and interpreter come from the
# recipes' environment, not from pre-commit. The shipped .pre-commit-hooks.yaml
# is for consumers; this repository gates commits with its recipes instead.
repos:
  - repo: local
    hooks:
      - id: just-fix
        name: just fix
        entry: just fix
        language: system
        pass_filenames: false
      - id: just-check
        name: just check
        entry: just check
        language: system
        pass_filenames: false
