[project]
name = "repodoc"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
branch = true
source = ["src/repodoc"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint]
select = [
    #"E4", "E7", "E9", # pycodestyle
    "E", # pycodestyle error
    "W", # pycodestyle warning
    "F", # Pyflakes
    "I", # isort
    "N", # pep8-naming
    "PL", # Pylint
    "D", # pydocstyle
    "RUF", # ruff specific rules
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EM", # flake8-errmsg
    "G", # flake8-logging-format
    #"PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PERF", # Perflint
    "FURB", # refurb
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ast".msg = "import the ast module only inside src/repodoc/collect.py"

[tool.ruff.lint.per-file-ignores]
"src/repodoc/collect.py" = ["TID251"]
