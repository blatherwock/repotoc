# The repodoc pre-commit hook. Regenerates the Markdown artifact from the
# consuming project's [tool.repodoc] config; no filenames are passed and no
# arguments are needed. The package requires Python >= 3.11; consumers whose
# pre-commit default interpreter is older pin language_version in their own
# hook configuration.
- id: repodoc
  name: repodoc
  description: Regenerate the repodoc Markdown artifact.
  entry: repodoc
  language: python
  pass_filenames: false
  files: (\.py$|^pyproject\.toml$)
