# The repotoc pre-commit hook. Regenerates the Markdown artifact from the
# consuming project's [tool.repotoc] config; no filenames are passed and no
# arguments are needed. The package requires Python >= 3.11; consumers whose
# pre-commit default interpreter is older pin language_version in their own
# hook configuration.
- id: repotoc
  name: repotoc
  description: Regenerate the repotoc Markdown artifact.
  entry: repotoc
  language: python
  pass_filenames: false
  files: (\.py$|^pyproject\.toml$)
